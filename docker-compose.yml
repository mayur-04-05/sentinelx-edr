version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sentinelx-db
    restart: always
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelxpassword123
      POSTGRES_DB: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://sentinelx:sentinelxpassword123@db:5432/sentinelx
      - JWT_SECRET=supersecretkeychangeinproduction1234567890
      - AI_PROVIDER=none
      - AI_API_KEY=
      - OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
